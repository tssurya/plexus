{{- $selector := .Values.ovnKubernetes.frrConfigurationSelector | default dict -}}
{{- if and (empty (get $selector "matchLabels")) (empty (get $selector "matchExpressions")) -}}
{{- fail "ovnKubernetes.frrConfigurationSelector must contain matchLabels or matchExpressions" -}}
{{- end -}}
apiVersion: plexus.io/v1beta1
kind: PlexusControllerConfig
metadata:
  name: plexus
spec:
  backend: ovn-kubernetes
  ovnKubernetes:
    vtepCIDRs:
    {{- range .Values.ovnKubernetes.vtepCIDRs }}
    - {{ . | quote }}
    {{- end }}
    frrConfigurationSelector:
      {{- toYaml $selector | nindent 6 }}
